name: Daily AI News Collection

on:
  schedule:
    # 毎日 22:00 UTC = 07:00 JST に実行
    - cron: '0 22 * * *'
  workflow_dispatch: # 手動実行も可能

jobs:
  collect-news:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install feedparser requests

      - name: Run news collection pipeline
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python3 scripts/collect_news.py

      - name: Commit and push changes
        run: |
          git config user.name "AI News Bot"
          git config user.email "bot@ai-news-daily.com"
          git add data/ index.html
          git diff --staged --quiet || git commit -m "Update: $(date -u +%Y-%m-%d) AIニュース更新"
          git push
